# Spring Boot Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration using Environment Variables with default fallback
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_neighbour?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
# Minimum 256-bit secure secret key
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration for React Frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ais-dev-7kpak4l5qt44vj64jmprop-290314020989.asia-east1.run.app}

# Gemini AI API Configuration
